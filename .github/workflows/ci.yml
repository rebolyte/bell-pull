name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: denoland/deno:2.5.6
    steps:
      - uses: actions/checkout@v4
      - run: deno lint

  fmt:
    runs-on: ubuntu-latest
    container:
      image: denoland/deno:2.5.6
    steps:
      - uses: actions/checkout@v4
      - run: deno fmt --check

  test:
    runs-on: ubuntu-latest
    container:
      image: denoland/deno:2.5.6
    steps:
      - uses: actions/checkout@v4
      - run: deno test --allow-net --allow-read --allow-env --unstable-broadcast-channel
